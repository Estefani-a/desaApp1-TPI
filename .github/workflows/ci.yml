name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (build, lint y tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar, Lint y tests
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace

      - name: Subir reportes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-app
          path: |
            mobile/app/build/reports/
            mobile/app/build/test-results/

  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar backend
        id: detect
        run: |
          if [ -f backend/pom.xml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existe backend/pom.xml todavía: se omite el build del backend."
          fi

      - uses: actions/setup-java@v4
        if: steps.detect.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: mvn verify
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: mvn --batch-mode verify
