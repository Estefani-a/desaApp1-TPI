# Levanta PostgreSQL, Mailpit y el backend juntos (CONVENCIONES §10.7):
#   cp .env.example .env
#   docker compose up --build
# Solo la base y el correo, para correr el backend desde IntelliJ con el perfil "local":
#   docker compose up db mailpit
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uniride
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Solo en esta máquina (127.0.0.1): nadie de la red llega a la base
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    # Solo en esta máquina: Mailpit no tiene login y muestra los enlaces de activación y de
    # recuperación de contraseña, así que no se expone a la red
    ports:
      - "127.0.0.1:8025:8025" # web: http://localhost:8025
      - "127.0.0.1:1025:1025" # SMTP

  backend:
    build: ./backend
    environment:
      # Dentro de Docker se usan los nombres de los servicios, no localhost
      DB_URL: jdbc:postgresql://db:5432/uniride
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      APP_LINK_BASE_URL: ${APP_LINK_BASE_URL}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      # "demo" carga los usuarios de prueba (data-demo.sql). Vacío en un despliegue real.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE-demo}
    # La API sí queda en toda la red, para probar desde un teléfono en el mismo Wi-Fi
    # (el emulador llega por 10.0.2.2). Todo salvo las rutas públicas pide token.
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
